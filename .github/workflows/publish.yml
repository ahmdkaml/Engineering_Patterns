name: Publish Implementation

on:
  push:
    paths:
      - '**/publish.json'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed publish.json files
        id: publish
        shell: bash
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
            BEFORE_SHA="HEAD~1"
          fi

          files=$(git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" | grep -E '(^|/)publish\.json$' || true)
          count=$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)

          if [ "$count" -gt 1 ]; then
            echo "::error::More than one publish.json was changed in this push:"
            printf '%s\n' "$files"
            exit 1
          fi

          if [ "$count" -eq 0 ]; then
            echo "No publish.json changed."
            exit 0
          fi

          publish_file="$files"
          echo "publish_file=$publish_file" >> "$GITHUB_OUTPUT"
          echo "Changed publish.json: $publish_file"

      - name: Read publish.json
        if: steps.publish.outputs.publish_file != ''
        run: |
          cat "${{ steps.publish.outputs.publish_file }}"

      - name: Check publish flag
        if: steps.publish.outputs.publish_file != ''
        id: content
        env:
          PUBLISH_FILE: ${{ steps.publish.outputs.publish_file }}
        shell: bash
        run: |
          publish=$(jq -r '.publish // false' "$PUBLISH_FILE")

          if [ "$publish" != "true" ]; then
            echo "publish.json has publish=false. Nothing to publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish.json has publish=true."

          title=$(jq -r '.title // empty' "$PUBLISH_FILE")
          content=$(jq -r '.content // empty' "$PUBLISH_FILE")
          url=$(jq -r '.url // empty' "$PUBLISH_FILE")

          if [ -z "$title" ] || [ -z "$content" ] || [ -z "$url" ]; then
            echo "::error::Missing required fields (title, content, or url) in $PUBLISH_FILE."
            exit 1
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Get LinkedIn member ID
        if: steps.content.outputs.should_publish == 'true'
        id: linkedin
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        shell: bash
        run: |
          response=$(curl -s --fail-with-body \
            -H "Authorization: Bearer $LINKEDIN_ACCESS_TOKEN" \
            -H "X-Restli-Protocol-Version: 2.0.0" \
            "https://api.linkedin.com/v2/userinfo")

          member_id=$(echo "$response" | jq -r '.sub // empty')

          if [ -z "$member_id" ]; then
            echo "::error::Could not determine LinkedIn member ID."
            exit 1
          fi

          echo "LinkedIn member identity verified."
          echo "member_id=$member_id" >> "$GITHUB_OUTPUT"

      - name: Publish to LinkedIn
        if: steps.content.outputs.should_publish == 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_FILE: ${{ steps.publish.outputs.publish_file }}
          MEMBER_ID: ${{ steps.linkedin.outputs.member_id }}
        shell: bash
        run: |
          # Construct payload directly in jq to preserve multiline formatting safely
          jq --arg author "urn:li:person:$MEMBER_ID" '
            . as $in |
            ($in.tags // [] | map("#" + .) | join(" ")) as $tagStr |
            ($in.content + (if ($tagStr | length) > 0 then "\n\n" + $tagStr else "" end)) as $fullCommentary |
            {
              author: $author,
              commentary: $fullCommentary,
              visibility: "PUBLIC",
              distribution: {
                feedDistribution: "MAIN_FEED",
                targetEntities: [],
                thirdPartyDistributionChannels: []
              },
              content: {
                article: {
                  source: $in.url,
                  title: $in.title,
                  description: $in.content
                }
              },
              lifecycleState: "PUBLISHED",
              isReshareDisabledByAuthor: false
            }
          ' "$PUBLISH_FILE" > payload.json

          echo "Generated payload:"
          cat payload.json

          echo -e "\nPublishing to LinkedIn..."
          curl -s --fail-with-body \
            --request POST \
            --url "https://api.linkedin.com/rest/posts" \
            --header "Authorization: Bearer $LINKEDIN_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --header "Linkedin-Version: 202608" \
            --header "X-Restli-Protocol-Version: 2.0.0" \
            --data @payload.json

          echo -e "\nLinkedIn publication successful."
